<!doctype html>
<html lang="{{LANG：zh-CN 或 en}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
══════════════════════ DIRECTOR'S BRIEF ══════════════════════
片名 Title     : {{片名}}
概念 Concept   : {{一句话视觉概念——用画面讲的那个点子，而不是内容描述}}
风格 Preset    : {{P# 名称（如有品牌色覆盖，写明）}}
色板 Palette   : {{--bg / --fg / --accent / --accent-2 的 hex}}
字体 Type      : {{display / text / mono / 中文}}
节奏 Tempo     : {{BPM}} BPM · 1 拍 = {{秒}}s · 总长 {{秒}}s · 画幅 {{16:9 | 9:16 | 1:1}}
动势 Motion    : {{运动性格，三个词}}
英雄时刻 Hero  : {{第几场 · 做什么}}
══════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{GOOGLE_FONTS_URL}}">
<style>
/* ══════ REEL BASE v1 · 不要修改 / DO NOT EDIT ══════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--fg);font-family:var(--font-text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;user-select:none}
.stage{position:absolute;left:50%;top:50%;width:var(--w,1920px);height:var(--h,1080px);transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:hidden;background:var(--bg);isolation:isolate}
.rig,.scene,.cam,.layer,.tx{position:absolute;inset:0}
.scene{overflow:hidden}
.scene:not(.on){display:none}
.cam{transform-origin:50% 50%}
.tx{pointer-events:none;z-index:40}
.ch,.w{display:inline-block;white-space:pre}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .04em;margin:-.12em -.04em}
.line{display:block;overflow:hidden;padding:.08em 0;margin:-.08em 0}
.line>*{display:inline-block}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
.fx-grain{position:absolute;inset:-200px;pointer-events:none;z-index:60;opacity:var(--grain,.08);mix-blend-mode:overlay;background-size:256px 256px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.fx-vignette{position:absolute;inset:0;pointer-events:none;z-index:61;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,var(--vignette,.5)) 100%)}
.letterbox{position:absolute;inset:0;pointer-events:none;z-index:70}
.letterbox::before,.letterbox::after{content:"";position:absolute;left:0;right:0;height:calc(var(--lb,0) * 1px);background:#000}
.letterbox::before{top:0}.letterbox::after{bottom:0}
.hud{position:absolute;inset:0;pointer-events:none;z-index:80}
.reel-ui{position:fixed;left:0;right:0;bottom:0;z-index:999;padding:10px 20px 14px;opacity:0;transition:opacity .3s;color:#fff;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.reel-ui.show,.reel-paused .reel-ui{opacity:1}
.reel-bar{position:relative;height:3px;margin:8px 0 10px;background:rgba(255,255,255,.25);cursor:pointer}
.reel-bar::after{content:"";position:absolute;inset:-10px 0}
.reel-bar i{position:absolute;inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
.reel-meta{display:flex;justify-content:space-between;gap:20px;opacity:.85}
.reel-clean .reel-ui,.reel-render .reel-ui{display:none}
/* ══════ /REEL BASE ══════ */

/* ══════ DESIGN TOKENS（按导演方案填写） ══════ */
:root{
  --w:1920px; --h:1080px;   /* 画幅：16:9 = 1920×1080 · 9:16 = 1080×1920 · 1:1 = 1080×1080 */
  --bg:{{#hex}}; --fg:{{#hex}}; --accent:{{#hex}}; --accent-2:{{#hex}};
  --font-display:{{'Display 字体', 中文字体, 系统中文回退, serif/sans-serif}};
  --font-text:{{'正文字体', 'PingFang SC', 'Microsoft YaHei', sans-serif}};
  --font-mono:{{'Mono 字体', ui-monospace, Consolas, monospace}};
  --grain:{{0–.16}}; --vignette:{{0–.8}}; --lb:{{0 或 138（2.39:1 遮幅）}};
}

/* ══════ SCENE STYLES ══════ */
{{场景样式：按场景分组，每组以 /* s1 · 标题 */ 开头}}
</style>
</head>
<body>
<div class="stage">
  <div class="rig">
    <!-- ══ SCENES：每个分镜一个 section，id 与 STORYBOARD 一致，所有内容放进 .cam ══
    <section class="scene" id="s1">
      <div class="cam">
        <div class="layer bg">背景层：色块 / 网格 / 纹理 / 环境光</div>
        <div class="layer main">主体层：大字排版 / 主形状</div>
        <div class="layer detail">细节层：编号 / 标签 / 细线 / 坐标</div>
      </div>
    </section>
    -->
{{SCENES}}
    <!-- ══ 转场层：全局擦除面板 / 遮罩等（不需要就留空） ══ -->
    <div class="tx">{{TRANSITION_ELEMENTS}}</div>
    <div class="fx-flash"></div>
  </div>
  <div class="fx-grain"></div>
  <div class="fx-vignette"></div>
  <div class="letterbox"></div>
  <div class="hud">{{HUD：时间码 data-reel="timecode" / 场景计数 data-reel="scene" / 进度 data-reel="progress" / 标签；极简风格可留空}}</div>
</div>
